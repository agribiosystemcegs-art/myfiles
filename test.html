<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- The Android app's test screen (screenshot block). Opened only by the Android app's own WebView screen (FLAG_SECURE), with a
       one-use test pass in the address fragment: js/testhost.js. Nothing here signs in with Google. connect-src names no
       localhost address (dev/serve.js adds it for the copy it serves on this computer). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://cdn.jsdelivr.net/npm/mathjax@3.2.2/ https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob:; connect-src 'self' blob: data: https://script.google.com https://script.googleusercontent.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; frame-src 'self' blob:; worker-src 'self' blob:; child-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1D7A33">
  <meta name="color-scheme" content="light">
  <title>MyFiles Test</title>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <!-- line icons: Lucide geometry (ISC license, lucide.dev) -->
      <symbol id="i-lock" viewBox="0 0 24 24"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
      <symbol id="i-hour" viewBox="0 0 24 24"><path d="M5 22h14"/><path d="M5 2h14"/><path d="M17 22v-4.172a2 2 0 0 0-.586-1.414L12 12l-4.414 4.414A2 2 0 0 0 7 17.828V22"/><path d="M7 2v4.172a2 2 0 0 0 .586 1.414L12 12l4.414-4.414A2 2 0 0 0 17 6.172V2"/></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></symbol>
    </defs>
  </svg>

  <!-- Before the test is on screen: what is happening -->
  <section id="scrWait" class="screen ready">
    <div class="ready-box">
      <div class="tile-ico" aria-hidden="true"><svg class="i"><use href="#i-lock"/></svg></div>
      <h1 class="title">Test Screen</h1>
      <p class="lead">Screenshots and screen recording are blocked on this screen. Your test opens here.</p>
    </div>
  </section>

  <!-- The test page, in a sandboxed frame (an origin of its own), as in the app -->
  <section id="scrApp" class="app pgstat" hidden>
    <div class="frame-wrap"><iframe id="page" title="MyFiles Test" sandbox="allow-scripts allow-forms allow-modals"></iframe></div>
  </section>

  <!-- The panel: waiting, then the test, or Failed with what to do -->
  <div id="result" class="sheet-wrap top" hidden>
    <div class="sheet result" role="dialog" aria-modal="true" aria-labelledby="resTitle" aria-describedby="resLine">
      <div class="res-ico" id="resIco" aria-hidden="true"><svg class="i"><use id="resIcoUse" href="#i-check"/></svg></div>
      <h2 id="resTitle" class="ptitle" aria-live="polite"></h2>
      <p id="resLine" class="lead"></p>
      <button id="resRetry" class="btn primary wide" type="button" hidden><svg class="i" aria-hidden="true"><use href="#i-refresh"/></svg>Try Again</button>
      <button id="resBack" class="btn ghost wide" type="button" hidden>Back to MyFiles</button>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="js/libs.js"></script>
  <script src="js/store.js"></script>
  <script src="js/net.js"></script>
  <script src="js/sealed.js"></script>
  <script src="js/shim.js"></script>
  <script src="js/testhost.js"></script>
</body>
</html>
