server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # The service worker, the page, the settings and the app's scripts must always be checked for a new version.
  location ~ ^/(sw\.js|index\.html|config\.js|style\.css)$ {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff;
  }
  location /js/ {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff;
  }
  location ~ \.webmanifest$ {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }
  location = /.well-known/assetlinks.json {
    default_type application/json;
    add_header Cache-Control "max-age=300";
  }
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "max-age=3600";
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()";
  }
}
