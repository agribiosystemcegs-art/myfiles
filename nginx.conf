# MyFiles app on the school server (Dockerfile). Static files only; HTTPS is added by the proxy in front.
# Every location includes security-headers.inc as its first line: a location with an add_header of its own does not inherit
# the server's, so a new location needs the include too.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  include /etc/nginx/security-headers.inc;

  # the app's pages and the files that must be fresh: checked with the server on every visit
  location ~ ^/(sw\.js|index\.html|test\.html|config\.js|style\.css)$ {
    include /etc/nginx/security-headers.inc;
    add_header Cache-Control "no-cache";
  }
  location /js/ {
    include /etc/nginx/security-headers.inc;
    add_header Cache-Control "no-cache";
  }
  location ~ \.webmanifest$ {
    include /etc/nginx/security-headers.inc;
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }
  # the Android app's link to this address
  location = /.well-known/assetlinks.json {
    include /etc/nginx/security-headers.inc;
    default_type application/json;
    add_header Cache-Control "max-age=300";
  }
  # everything else (icons, the font, vendor files). A file that is not there is a 404, never the app's page: the app has one
  # page and no addresses of its own making, and a missing file must not be kept by phones as if it were the real one.
  location / {
    include /etc/nginx/security-headers.inc;
    try_files $uri $uri/ =404;
    add_header Cache-Control "max-age=3600";
  }
}
